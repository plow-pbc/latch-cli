name: latch

on:
  push:
    branches: [main, ci-speed]
  pull_request:
    # `labeled`: adding the `mac` label runs the Mac tests on a pull request.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      mode:
        description: 'PR checks, main checks, or runner access probe'
        type: choice
        options: [pr, main, probe]
        default: pr
      source-ref:
        description: 'Optional source commit for a baseline comparison'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: latch-${{ github.event.pull_request.number || github.run_id }}-${{ inputs.mode || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What this run tests. A push to main (or a dispatch) tests everything. A
  # pull request skips everything for a docs-only change, and runs the Mac
  # jobs only as the repository variable LATCH_PR_MAC says:
  #   paths (default): when it has the `mac` label or changes a path below;
  #   label: only with the `mac` label, so pull requests test on Linux only;
  #   always: on every pull request.
  # The browser is among the paths: Linux runs none of its tests.
  changes:
    if: github.ref != 'refs/heads/ci-speed' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'probe')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.pick.outputs.code }}
      mac: ${{ steps.pick.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its first parent, the base.
          fetch-depth: 2
      - id: pick
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'mac') }}
          PR_MAC: ${{ vars.LATCH_PR_MAC || 'paths' }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          MAC = re.compile(r"""^(
              latch/src/sandbox | latch/src/secrets\.rs | latch/macos/
            | latch/messages-reader/ | latch/src/messages/ | latch/tests/messages/
            | latch/src/browser/ | latch/tests/browser- | latch/camoufox/
            | latch/install-binary\.sh | latch/browser-engines\.sh
            | latch/Cargo\.(toml|lock) | latch/rust-toolchain\.toml | latch/build\.rs
            | latch/scripts/test-(test-)?shard\.py | \.github/workflows/latch\.yml
          )""", re.X)
          if os.environ["PULL_REQUEST"] == "true":
              files = subprocess.check_output(["git", "diff", "--name-only", "HEAD^1", "HEAD"], text=True).split()
              code = any(not (f.endswith(".md") or f.startswith("docs/")) for f in files)
              mode = os.environ["PR_MAC"]
              mac = code and (mode == "always" or os.environ["LABELED"] == "true"
                              or (mode == "paths" and any(MAC.match(f) for f in files)))
          else:
              code = mac = True
          print(f"code={code} mac={mac} ({os.environ['PR_MAC']})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"code={str(code).lower()}\nmac={str(mac).lower()}\n")
          PY

  # The staging branch only probes runner access on push; benchmarks are dispatched.
  runner-access:
    if: github.ref == 'refs/heads/ci-speed' && (github.event_name == 'push' || inputs.mode == 'probe')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-xlarge, macos-15-large]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - run: uname -sm && getconf _NPROCESSORS_ONLN

  mac:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'push' || inputs.mode == 'main') && '[{"runner":"macos-15-large","shard":1,"count":4},{"runner":"macos-15-large","shard":2,"count":4},{"runner":"macos-15-large","shard":3,"count":4},{"runner":"macos-15-large","shard":4,"count":4}]' || '[{"runner":"macos-15","shard":1,"count":3},{"runner":"macos-15","shard":2,"count":3},{"runner":"macos-15","shard":3,"count":3}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: latch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: latch/scripts
      - run: rustup toolchain install
      - if: matrix.shard == 1
        run: python3 ../.ci-tools/latch/scripts/test-test-shard.py
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: latch -> target
          shared-key: mac-${{ matrix.runner }}
          save-if: ${{ matrix.shard == 1 }}
      - if: matrix.shard == 1
        run: cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings
      - uses: actions/cache@v4
        if: hashFiles('latch/src/browser/cft.json') != ''
        with:
          path: .dev/cft-state/plugins/cft
          key: cft-${{ runner.arch }}-${{ hashFiles('latch/src/browser/cft.json') }}
      - uses: actions/cache@v4
        if: hashFiles('latch/src/browser/camoufox.json') != ''
        with:
          path: .dev/cft-state/plugins/camoufox
          key: camoufox-${{ runner.arch }}-${{ hashFiles('latch/src/browser/camoufox.json', 'latch/camoufox/package.json', 'latch/camoufox/package-lock.json') }}
      - run: cargo build --locked
      - if: hashFiles('latch/src/browser/cft.json') != ''
        run: HOME="$RUNNER_TEMP/cft-home" sh install-binary.sh --state-dir ../.dev/cft-state --browser chrome --browser camoufox target/debug/latch
      - run: python3 ../.ci-tools/latch/scripts/test-shard.py ${{ matrix.shard }} ${{ matrix.count }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ runner.arch }}-${{ matrix.shard }}
          path: .dev/ci/*.json
          if-no-files-found: error

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: latch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: latch -> target
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The browser tests drive the pinned engines, Chrome for Testing and
      # Camoufox, headed, from where `just cft` installs them; the caches
      # keep their downloads (200 MB and 300 MB) to once per pin and
      # architecture.
      - if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: .dev/cft-state/plugins/cft
          key: cft-${{ runner.arch }}-${{ hashFiles('latch/src/browser/cft.json') }}
      - if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: .dev/cft-state/plugins/camoufox
          key: camoufox-${{ runner.arch }}-${{ hashFiles('latch/src/browser/camoufox.json', 'latch/camoufox/package.json', 'latch/camoufox/package-lock.json') }}
      - if: runner.os == 'macOS'
        run: cargo build --locked && HOME="$RUNNER_TEMP/cft-home" sh install-binary.sh --state-dir ../.dev/cft-state --browser chrome --browser camoufox target/debug/latch
      - run: cargo test --locked

  linux-static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: latch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/cache@v4
        with:
          path: |
            latch/target/cargo-home
            latch/target/musl-${{ matrix.arch }}
          key: musl-${{ matrix.arch }}-${{ hashFiles('latch/build-musl.sh', 'latch/rust-toolchain.toml') }}-${{ hashFiles('latch/Cargo.lock') }}
          restore-keys: musl-${{ matrix.arch }}-${{ hashFiles('latch/build-musl.sh', 'latch/rust-toolchain.toml') }}-
      - run: ./build-musl.sh ${{ matrix.arch }}
      - name: Make container build cache readable by the runner
        run: sudo chown -R "$(id -u):$(id -g)" target/cargo-home target/musl-${{ matrix.arch }}
      - run: file target/musl-${{ matrix.arch }}/release/latch | tee /dev/stderr | grep -Eq "statically linked|static-pie linked"
      - run: target/musl-${{ matrix.arch }}/release/latch --version
      - uses: actions/upload-artifact@v4
        with:
          name: latch-linux-${{ matrix.arch }}
          path: latch/target/musl-${{ matrix.arch }}/release/latch

  # The Messages reader (Swift, macOS only): its tests against synthetic
  # databases, with a bounded fuzz run of its body parser.
  messages-reader:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: latch/messages-reader
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - run: swift --version
      - run: LATCH_FUZZ_ITERATIONS=50000 swift test

  ci-required:
    name: ${{ inputs.source-ref != '' && 'ci-benchmark' || 'ci-required' }}
    if: always() && (github.ref != 'refs/heads/ci-speed' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'probe'))
    needs: [changes, mac, linux, linux-static, messages-reader]
    runs-on: ubuntu-24.04
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every platform and shard this run tests
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          print(json.dumps(results, indent=2))
          # A job `changes` left out is skipped; `changes` itself must succeed.
          assert results['changes']['result'] == 'success'
          assert all(job['result'] in ('success', 'skipped') for job in results.values())
          PY
