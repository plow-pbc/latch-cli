name: latch

on:
  push:
    branches: [main, ci-speed]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'PR checks, main checks, or runner access probe'
        type: choice
        options: [pr, main, probe]
        default: pr
      source-ref:
        description: 'Optional source commit for a baseline comparison'
        type: string
        default: ''

permissions:
  contents: read

# A new push to a pull request, or to a branch, cancels the run it
# supersedes: a merge commit holds every one before it.
concurrency:
  group: latch-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}-${{ inputs.mode || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  # What this run tests: everything, except a pull request that changes
  # only docs. Pull requests test on Linux; the Mac runs on main, and by hand
  # on any branch with the mac-tests workflow.
  changes:
    if: github.ref != 'refs/heads/ci-speed' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'probe')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.pick.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its first parent, the base.
          fetch-depth: 2
      - id: pick
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          code = True
          if os.environ["PULL_REQUEST"] == "true":
              files = subprocess.check_output(["git", "diff", "--name-only", "HEAD^1", "HEAD"], text=True).split()
              code = any(not (f.endswith(".md") or f.startswith("docs/")) for f in files)
          print(f"code={code}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"code={str(code).lower()}\n")
          PY

  # The staging branch only probes runner access on push; benchmarks are dispatched.
  runner-access:
    if: github.ref == 'refs/heads/ci-speed' && (github.event_name == 'push' || inputs.mode == 'probe')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-xlarge, macos-15-large]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - run: uname -sm && getconf _NPROCESSORS_ONLN

  # On main, one Mac job for what only a Mac tests: Seatbelt (the worker
  # tests and sandbox, exec and files), the Messages and Contacts reader,
  # secrets, the managed host under launchd, the real browser engines (Chrome
  # for Testing and Camoufox), and the app bundle; clippy too, for the
  # macOS-only code Linux never compiles. The integration test binaries run
  # whole; in latch's own tests, the modules below.
  mac:
    needs: changes
    if: github.event_name == 'push' || inputs.mode == 'main'
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: latch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: latch -> target
          shared-key: mac-macos-15
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --locked --features fake-gog -- -D warnings
      - uses: actions/cache@v4
        with:
          path: .dev/cft-state/plugins/cft
          key: cft-${{ runner.arch }}-${{ hashFiles('latch/src/browser/cft.json') }}
      - uses: actions/cache@v4
        with:
          path: .dev/cft-state/plugins/camoufox
          key: camoufox-${{ runner.arch }}-${{ hashFiles('latch/src/browser/camoufox.json', 'latch/camoufox/package.json', 'latch/camoufox/package-lock.json') }}
      - run: cargo build --locked
      - run: HOME="$RUNNER_TEMP/cft-home" sh install-binary.sh --state-dir ../.dev/cft-state --browser chrome --browser camoufox target/debug/latch
      # fake-gog: the test-only gog stand-in the return scenario reads mail with.
      - run: 'cargo test --locked --features fake-gog --bins -- browser:: sandbox:: secrets:: messages:: exec:: files:: serve::'
      - run: cargo test --locked --features fake-gog --test cli --test setup --test worker
      - run: LATCH_FUZZ_ITERATIONS=50000 swift test
        working-directory: latch/messages-reader
      - run: |
          app="$RUNNER_TEMP/Plow Latch.app"
          sh ../scripts/macos-app-bundle.sh 0.0.0 target/debug/latch "$app"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          "$app/Contents/MacOS/latch" --version

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: latch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: latch -> target
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The browser tests drive the pinned engines, Chrome for Testing and
      # Camoufox, headed, from where `just cft` installs them; the caches
      # keep their downloads (200 MB and 300 MB) to once per pin and
      # architecture.
      - if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: .dev/cft-state/plugins/cft
          key: cft-${{ runner.arch }}-${{ hashFiles('latch/src/browser/cft.json') }}
      - if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: .dev/cft-state/plugins/camoufox
          key: camoufox-${{ runner.arch }}-${{ hashFiles('latch/src/browser/camoufox.json', 'latch/camoufox/package.json', 'latch/camoufox/package-lock.json') }}
      - if: runner.os == 'macOS'
        run: cargo build --locked && HOME="$RUNNER_TEMP/cft-home" sh install-binary.sh --state-dir ../.dev/cft-state --browser chrome --browser camoufox target/debug/latch
      - run: cargo test --locked

  linux-static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: latch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/cache@v4
        with:
          path: |
            latch/target/cargo-home
            latch/target/musl-${{ matrix.arch }}
          key: musl-${{ matrix.arch }}-${{ hashFiles('latch/build-musl.sh', 'latch/rust-toolchain.toml') }}-${{ hashFiles('latch/Cargo.lock') }}
          restore-keys: musl-${{ matrix.arch }}-${{ hashFiles('latch/build-musl.sh', 'latch/rust-toolchain.toml') }}-
      - run: ./build-musl.sh ${{ matrix.arch }}
      - name: Make container build cache readable by the runner
        run: sudo chown -R "$(id -u):$(id -g)" target/cargo-home target/musl-${{ matrix.arch }}
      - run: file target/musl-${{ matrix.arch }}/release/latch | tee /dev/stderr | grep -Eq "statically linked|static-pie linked"
      - run: target/musl-${{ matrix.arch }}/release/latch --version
      - uses: actions/upload-artifact@v4
        with:
          name: latch-linux-${{ matrix.arch }}
          path: latch/target/musl-${{ matrix.arch }}/release/latch

  ci-required:
    name: ${{ inputs.source-ref != '' && 'ci-benchmark' || 'ci-required' }}
    if: always() && (github.ref != 'refs/heads/ci-speed' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'probe'))
    needs: [changes, mac, linux, linux-static]
    runs-on: ubuntu-24.04
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every platform and shard this run tests
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          print(json.dumps(results, indent=2))
          # A job `changes` left out is skipped; `changes` itself must succeed.
          assert results['changes']['result'] == 'success'
          assert all(job['result'] in ('success', 'skipped') for job in results.values())
          PY
