name: latch

on:
  push:
    branches: [main, ci-speed]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'PR checks, main checks, or runner access probe'
        type: choice
        options: [pr, main, probe]
        default: pr
      source-ref:
        description: 'Optional source commit for a baseline comparison'
        type: string
        default: ''

permissions:
  contents: read

# A new push to a pull request, or to a branch, cancels the run it
# supersedes: a merge commit holds every one before it.
concurrency:
  group: latch-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}-${{ inputs.mode || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  # What this run tests: everything, except a pull request or a push whose
  # changes are only docs. Pull requests test on Linux, run the Mac app's
  # Swift tests (mac-smoke-build), and run the macOS archives on older Macs
  # (mac-smoke); the full Mac suite runs on main, and by hand on any branch
  # with the mac-tests workflow.
  changes:
    if: github.ref != 'refs/heads/ci-speed' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'probe')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.pick.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its first parent, the base.
          fetch-depth: 2
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          # A push's previous tip: on main, the merge commit's first parent.
          BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          code = True
          base = None
          if os.environ["EVENT"] == "pull_request":
              base = "HEAD^1"
          elif os.environ["EVENT"] == "push" and os.environ["BEFORE"].strip("0"):
              subprocess.run(["git", "fetch", "--quiet", "--depth=1", "origin", os.environ["BEFORE"]], check=True)
              base = os.environ["BEFORE"]
          if base:
              files = subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).split()
              code = any(not (f.endswith(".md") or f.startswith("docs/")) for f in files)
          print(f"code={code}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"code={str(code).lower()}\n")
          PY

  # The staging branch only probes runner access on push; benchmarks are dispatched.
  runner-access:
    if: github.ref == 'refs/heads/ci-speed' && (github.event_name == 'push' || inputs.mode == 'probe')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-xlarge, macos-15-large]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - run: uname -sm && getconf _NPROCESSORS_ONLN

  # On main, the full Mac suite (mac-tests) as one job. A Mac-only subset
  # would save nothing: the real-engine browser tests, Mac-only, are nearly
  # all of its time, and the tests Linux also runs take seconds here.
  mac:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || inputs.mode == 'main')
    uses: ./.github/workflows/mac-tests.yml
    with:
      ref: ${{ inputs.source-ref }}
      shards: 1

  # The Linux gate (`just test`) on arm64, where both engines are pinned:
  # linux-build lints and builds the tests once into a nextest archive, and
  # four shards and linux-restricted test that build.
  linux-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - run: rustup toolchain install
        working-directory: latch
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: latch -> target
          shared-key: linux-arm64
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest@0.9.148
      - run: just test --build-archive linux-tests.tar.zst --ci
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tests
          path: linux-tests.tar.zst
          retention-days: 1

  linux:
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      # Some tests build small fixtures with rustc as they run.
      - run: rustup toolchain install
        working-directory: latch
      - uses: actions/download-artifact@v4
        with:
          name: linux-tests
      - uses: actions/cache@v4
        with:
          path: .dev/cft-state/plugins/cft
          key: cft-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('latch/src/browser/cft.json') }}
      - uses: actions/cache@v4
        with:
          path: .dev/cft-state/plugins/camoufox
          key: camoufox-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('latch/src/browser/camoufox.json', 'latch/camoufox/package.json', 'latch/camoufox/package-lock.json') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest@0.9.148
      # Chrome with its own sandbox, as on most Linux hosts: with Ubuntu's
      # user namespace restriction on, latch runs Chrome without it
      # (linux-restricted below), so this job lifts the restriction first.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # latch's Linux sandbox, as install-binary.sh installs it.
      - run: sudo apt-get install -y -q bubblewrap
      # The lifecycle suite's systemd: a lingering user session.
      - run: |
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - run: just test --shard ${{ matrix.shard }}/4 --from-archive linux-tests.tar.zst --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-tests-${{ matrix.shard }}
          path: .dev/ci/*.json
          if-no-files-found: error

  # The runner as Ubuntu ships it: the restriction on, Ubuntu's bwrap
  # profile loaded by the installer, so latch runs Chrome with page
  # isolation off; status --local says so, and `just test browser` runs
  # Chrome's conformance checks.
  linux-restricted:
    needs: linux-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - run: rustup toolchain install
        working-directory: latch
      - uses: actions/download-artifact@v4
        with:
          name: linux-tests
      - uses: actions/cache@v4
        with:
          path: .dev/cft-state/plugins/cft
          key: cft-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('latch/src/browser/cft.json') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest@0.9.148
      - name: Worker userns confinement under Docker AppArmor
        run: |
          sudo apt-get install -y -q apparmor
          sudo apparmor_parser -r latch/docker/latch-bwrap.apparmor
          sudo python3 - <<'PYTHON'
          def check(path, expected):
              # Label query, AA_CLASS_FILE (2), then the complete path.
              request = b"label\0latch-bwrap\0\x02" + path.encode()
              with open("/sys/kernel/security/apparmor/.access", "r+b", buffering=0) as access:
                  assert access.write(request) == len(request)
                  permissions = dict(line.split() for line in access.read(4096).decode().splitlines())
              allowed = int(permissions["allow"], 16) & ~int(permissions["deny"], 16) & 2
              assert bool(allowed) == expected, (path, permissions, expected)
          target = "/proc/sys/user/max_user_namespaces"
          check(target, True)
          for n in range(len("/proc/sys/u"), len(target)):
              check(target[:n], False)
          for n in range(len("/proc/sys/u"), len(target)):
              for replacement in "aZ0_/":
                  if replacement != target[n]:
                      check(target[:n] + replacement + target[n + 1:], False)
          for suffix in ("_extra", "/", "/child"):
              check(target + suffix, False)
          for path in ("user/max_mnt_namespaces", "user/max_pid_namespaces", "kernel/hostname", "net/ipv4/ip_forward"):
              check("/proc/sys/" + path, False)
          check("/proc/sys/kernel/shmmax", True)
          print("AppArmor: only the userns limit is writable; prefixes, neighbours and other sysctls remain denied")
          PYTHON
          docker build -q -t latch-linux-test:ci -f latch/docker/Dockerfile.test latch/docker
          docker run --rm --init --user "$(id -u):$(id -g)" --cap-drop=ALL \
            --security-opt=no-new-privileges=true --security-opt=systempaths=unconfined \
            --security-opt=apparmor=latch-bwrap --security-opt="seccomp=$PWD/latch/docker/seccomp.json" \
            -v "$PWD:$PWD" -w "$PWD/latch" -e HOME=/tmp latch-linux-test:ci \
            sh -ec 'test "$(cat /proc/self/attr/current)" = "latch-bwrap (enforce)"
              cargo nextest run --archive-file ../linux-tests.tar.zst --workspace-remap . --extract-to . --extract-overwrite \
                --success-output immediate -E "binary(worker) & test(an_exec_worker_cannot_create_nested_user_namespaces)"'
      - run: test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
      - name: Browser sandboxes under the shipped Docker seccomp profile
        run: |
          sudo apt-get install -y -q apparmor
          sudo apparmor_parser -r latch/docker/latch-bwrap.apparmor
          docker build -q -t latch-linux-test:ci -f latch/docker/Dockerfile.test latch/docker
          docker run --rm --init --user "$(id -u):$(id -g)" --cap-drop=ALL \
            --security-opt=no-new-privileges=true --security-opt=systempaths=unconfined \
            --security-opt=apparmor=latch-bwrap --security-opt="seccomp=$PWD/latch/docker/seccomp.json" \
            --shm-size=1g -v "$PWD:$PWD" -w "$PWD" -e HOME=/tmp latch-linux-test:ci \
            sh -ec 'test "$(cat /proc/self/attr/current)" = "latch-bwrap (enforce)"
              sh latch/browser-engines.sh --state-dir .dev/cft-state chrome camoufox
              cd latch
              cargo nextest run --archive-file ../linux-tests.tar.zst --workspace-remap . --extract-to . --extract-overwrite \
                --success-output immediate -E "test(the_engine_runs_from_the_host_with_its_own_sandbox_and_leaves_nothing)"'
      # The archive's latch, unpacked where it was built, installs Ubuntu's
      # bwrap profile and reports the reduced isolation.
      - run: cargo nextest list --archive-file ../linux-tests.tar.zst --workspace-remap . --extract-to . --extract-overwrite > /dev/null
        working-directory: latch
      - run: HOME="$RUNNER_TEMP/cft-home" sh install-binary.sh --non-interactive --no-browser target/debug/latch
        working-directory: latch
      - run: latch/target/debug/latch --state-dir "$RUNNER_TEMP/status-state" status --local | tee /dev/stderr | grep -q '"page_isolation":"page isolation off on this host"'
      - run: just test browser --from-archive linux-tests.tar.zst --ci

  # x86_64 Linux, where no Chrome for Testing is pinned: the gate runs every
  # suite but browser and scenario, and says so.
  linux-x64:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - run: rustup toolchain install
        working-directory: latch
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: latch -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest@0.9.148
      - run: |
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - run: just test --ci

  linux-static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: latch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/cache@v4
        with:
          path: |
            latch/target/cargo-home
            latch/target/musl-${{ matrix.arch }}
          key: musl-${{ matrix.arch }}-${{ hashFiles('latch/build-musl.sh', 'latch/rust-toolchain.toml') }}-${{ hashFiles('latch/Cargo.lock') }}
          restore-keys: musl-${{ matrix.arch }}-${{ hashFiles('latch/build-musl.sh', 'latch/rust-toolchain.toml') }}-
      - run: ./build-musl.sh ${{ matrix.arch }}
      - name: Make container build cache readable by the runner
        run: sudo chown -R "$(id -u):$(id -g)" target/cargo-home target/musl-${{ matrix.arch }}
      - run: file target/musl-${{ matrix.arch }}/release/latch | tee /dev/stderr | grep -Eq "statically linked|static-pie linked"
      - run: target/musl-${{ matrix.arch }}/release/latch --version
      - uses: actions/upload-artifact@v4
        with:
          name: latch-linux-${{ matrix.arch }}
          path: latch/target/musl-${{ matrix.arch }}/release/latch

  # The macOS archives, built on macOS 26 as a release builds them (unsigned
  # and in debug), for mac-smoke to run on older Macs.
  mac-smoke-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - run: rustup toolchain install && rustup target add aarch64-apple-darwin x86_64-apple-darwin
        working-directory: latch
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: latch -> target
          shared-key: mac-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        working-directory: latch
        run: |
          LATCH_MESSAGES_READER_SHA256=$(messages-reader/build.sh | tail -n 1)
          export LATCH_MESSAGES_READER_SHA256
          gui/build.sh
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --target "$target"
            sh ../scripts/package-release.sh v0.0.0-smoke "$target" "$PWD/target/$target/debug/latch"
          done
      # The app's model tests, and its contract tests on the arm64 latch just
      # built. Main's full `mac` job runs them itself.
      - name: Swift app tests
        if: github.event_name != 'push' && inputs.mode != 'main'
        working-directory: latch/gui
        run: LATCH_CONTRACT_LATCH="$PWD/../target/aarch64-apple-darwin/debug/latch" swift test
      - uses: actions/upload-artifact@v4
        with:
          name: mac-smoke
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Each archive on the oldest macOS GitHub offers for its architecture: the
  # rest of Mac CI runs on macOS 26 only.
  mac-smoke:
    needs: mac-smoke-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: mac-smoke
      - run: |
          tar -xzf latch-v0.0.0-smoke-${{ matrix.target }}.tar.gz
          sh scripts/macos-smoke.sh latch-v0.0.0-smoke-${{ matrix.target }}

  ci-required:
    name: ${{ inputs.source-ref != '' && 'ci-benchmark' || 'ci-required' }}
    if: always() && (github.ref != 'refs/heads/ci-speed' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'probe'))
    needs: [changes, mac, linux-build, linux, linux-restricted, linux-x64, linux-static, mac-smoke-build, mac-smoke]
    runs-on: ubuntu-24.04
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every platform and shard this run tests
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          print(json.dumps(results, indent=2))
          # A job `changes` left out is skipped; `changes` itself must succeed.
          assert results['changes']['result'] == 'success'
          assert all(job['result'] in ('success', 'skipped') for job in results.values())
          PY
