name: latch

on:
  push:
    branches: [main, ci-speed]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'PR checks, main checks, or runner access probe'
        type: choice
        options: [pr, main, probe]
        default: pr
      source-ref:
        description: 'Optional source commit for a baseline comparison'
        type: string
        default: ''

permissions:
  contents: read

# A new push to a pull request, or to a branch, cancels the run it
# supersedes: a merge commit holds every one before it.
concurrency:
  group: latch-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}-${{ inputs.mode || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  # What this run tests: everything, except a pull request that changes
  # only docs. Pull requests test on Linux; the Mac runs on main, and by hand
  # on any branch with the mac-tests workflow.
  changes:
    if: github.ref != 'refs/heads/ci-speed' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'probe')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.pick.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its first parent, the base.
          fetch-depth: 2
      - id: pick
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          code = True
          if os.environ["PULL_REQUEST"] == "true":
              files = subprocess.check_output(["git", "diff", "--name-only", "HEAD^1", "HEAD"], text=True).split()
              code = any(not (f.endswith(".md") or f.startswith("docs/")) for f in files)
          print(f"code={code}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"code={str(code).lower()}\n")
          PY

  # The staging branch only probes runner access on push; benchmarks are dispatched.
  runner-access:
    if: github.ref == 'refs/heads/ci-speed' && (github.event_name == 'push' || inputs.mode == 'probe')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-xlarge, macos-15-large]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - run: uname -sm && getconf _NPROCESSORS_ONLN

  # On main, the full Mac suite (mac-tests) as one job. A Mac-only subset
  # would save nothing: the real-engine browser tests, Mac-only, are nearly
  # all of its time, and the tests Linux also runs take seconds here.
  mac:
    needs: changes
    if: github.event_name == 'push' || inputs.mode == 'main'
    uses: ./.github/workflows/mac-tests.yml
    with:
      ref: ${{ inputs.source-ref }}
      shards: 1

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: latch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: latch -> target
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The real-engine browser tests, on Linux arm64 (where Chrome for Testing
  # is pinned): built once into a nextest archive, which four jobs run a
  # quarter each of, with every test the browser feature compiles in, and
  # fake-gog's return scenario, as on the Mac. The linux job above runs the
  # rest on x86_64.
  browser-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    defaults:
      run:
        working-directory: latch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: latch -> target
          key: browser
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo clippy --all-targets --locked --features linux-browser-tests,fake-gog -- -D warnings
      - run: cargo nextest archive --locked --features linux-browser-tests,fake-gog --archive-file ../browser-tests.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: browser-tests
          path: browser-tests.tar.zst
          retention-days: 1

  browser:
    needs: browser-build
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    defaults:
      run:
        working-directory: latch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      # Some tests build small fixtures with rustc as they run.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@v4
        with:
          name: browser-tests
      - uses: actions/cache@v4
        with:
          path: .dev/cft-state/plugins/cft
          key: cft-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('latch/src/browser/cft.json') }}
      # Chrome with its own sandbox, as on most Linux hosts: with Ubuntu's
      # user namespace restriction on, install-binary.sh loads Ubuntu's bwrap
      # profile and latch runs Chrome without it (browser-restricted below),
      # so these jobs lift the restriction first and no profile is loaded.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Into target/, where the tests were built, so the paths compiled into
      # them hold.
      - run: cargo nextest list --archive-file ../browser-tests.tar.zst --workspace-remap . --extract-to . --extract-overwrite > /dev/null
      - run: HOME="$RUNNER_TEMP/cft-home" sh install-binary.sh --non-interactive --state-dir ../.dev/cft-state --browser chrome target/debug/latch
      - run: cargo nextest run --archive-file ../browser-tests.tar.zst --workspace-remap . --extract-to . --extract-overwrite --partition hash:${{ matrix.part }}/4 --test-threads 6 --no-fail-fast

  # The runner as Ubuntu ships it: the restriction on, Ubuntu's bwrap
  # profile loaded by the installer, so latch runs Chrome with page
  # isolation off; its Chrome tests and status --local say so.
  browser-restricted:
    needs: browser-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    defaults:
      run:
        working-directory: latch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@v4
        with:
          name: browser-tests
      - uses: actions/cache@v4
        with:
          path: .dev/cft-state/plugins/cft
          key: cft-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('latch/src/browser/cft.json') }}
      - run: cargo nextest list --archive-file ../browser-tests.tar.zst --workspace-remap . --extract-to . --extract-overwrite > /dev/null
      - run: HOME="$RUNNER_TEMP/cft-home" sh install-binary.sh --non-interactive --state-dir ../.dev/cft-state --browser chrome target/debug/latch
      - run: |
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          target/debug/latch --state-dir "$RUNNER_TEMP/status-state" status --local | tee /dev/stderr | grep -q '"page_isolation":"page isolation off on this host"'
      - run: cargo nextest run --archive-file ../browser-tests.tar.zst --workspace-remap . --extract-to . --extract-overwrite --test-threads 6 --no-fail-fast -E 'test(/^browser::tests::cft::/)'

  linux-static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: latch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/cache@v4
        with:
          path: |
            latch/target/cargo-home
            latch/target/musl-${{ matrix.arch }}
          key: musl-${{ matrix.arch }}-${{ hashFiles('latch/build-musl.sh', 'latch/rust-toolchain.toml') }}-${{ hashFiles('latch/Cargo.lock') }}
          restore-keys: musl-${{ matrix.arch }}-${{ hashFiles('latch/build-musl.sh', 'latch/rust-toolchain.toml') }}-
      - run: ./build-musl.sh ${{ matrix.arch }}
      - name: Make container build cache readable by the runner
        run: sudo chown -R "$(id -u):$(id -g)" target/cargo-home target/musl-${{ matrix.arch }}
      - run: file target/musl-${{ matrix.arch }}/release/latch | tee /dev/stderr | grep -Eq "statically linked|static-pie linked"
      - run: target/musl-${{ matrix.arch }}/release/latch --version
      - uses: actions/upload-artifact@v4
        with:
          name: latch-linux-${{ matrix.arch }}
          path: latch/target/musl-${{ matrix.arch }}/release/latch

  ci-required:
    name: ${{ inputs.source-ref != '' && 'ci-benchmark' || 'ci-required' }}
    if: always() && (github.ref != 'refs/heads/ci-speed' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'probe'))
    needs: [changes, mac, linux, browser-build, browser, browser-restricted, linux-static]
    runs-on: ubuntu-24.04
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every platform and shard this run tests
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          print(json.dumps(results, indent=2))
          # A job `changes` left out is skipped; `changes` itself must succeed.
          assert results['changes']['result'] == 'success'
          assert all(job['result'] in ('success', 'skipped') for job in results.values())
          PY
