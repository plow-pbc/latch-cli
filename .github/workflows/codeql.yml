name: codeql

# Code scanning, with the same languages, runners and build modes GitHub's
# default setup used, plus what it can't take: .github/codeql/codeql-config.yml,
# and Rust extracted without `cfg(test)`, so `#[cfg(test)]` modules and their
# made-up passwords and test cards are never analysed. Default setup must be
# off for this workflow's results to upload.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: actions, build-mode: none, os: ubuntu-latest }
          - { language: javascript-typescript, build-mode: none, os: ubuntu-latest }
          - { language: python, build-mode: none, os: ubuntu-latest }
          - { language: rust, build-mode: none, os: ubuntu-latest }
          - { language: swift, build-mode: autobuild, os: macos-latest }
    env:
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_CFG_OVERRIDES: -test
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
