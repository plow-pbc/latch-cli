name: release
# fda-spike branch only: this file is replaced by one job that builds and
# signs the Full Disk Access spike's probes. Nothing is released and
# nothing is run against protected paths here. Throwaway branch.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fda-spike:
    environment: release
    runs-on: macos-15
    timeout-minutes: 20
    env:
      IDENTITY: 'Developer ID Application: The Plow Collective, Inc (3559PD337Z)'
    steps:
      - uses: actions/checkout@v4
      - name: Load signing credentials
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APPLE_CERTIFICATE_P12_BASE64: op://terraform/GitHub Actions Release Secrets/APPLE_CERTIFICATE_P12_BASE64
          APPLE_CERTIFICATE_PASSWORD: op://terraform/GitHub Actions Release Secrets/APPLE_CERTIFICATE_PASSWORD  # pragma: allowlist secret
      - name: Import signing identity
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          keychain_password=$(openssl rand -base64 32)
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          cert="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert"
          security import "$cert" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm "$cert"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "\"$IDENTITY\""
      # Two builds of the same source, `one` and `two`, so the rebuild test
      # swaps in a different cdhash under the same identity. Each build has
      # variant A (a bare binary), B (an app bundle) and C's outside binary.
      - name: Build and sign
        shell: bash
        run: |
          sign() {
            codesign --force --options runtime --timestamp --keychain "$KEYCHAIN_PATH" \
              --identifier "$1" --sign "$IDENTITY" "$2"
          }
          for build in one two; do
            out="spike/$build"
            mkdir -p "$out/A" "$out/C" "$out/B/Plow Latch CLI.app/Contents/MacOS"
            clang -O2 -Wall -Wextra -arch arm64 -mmacosx-version-min=13.0 -DBUILD="\"$build\"" \
              -o "$RUNNER_TEMP/fda-probe" latch/macos/fda-spike/fda-probe.c
            cp "$RUNNER_TEMP/fda-probe" "$out/A/fda-probe"
            sign co.plow.latch.fdaspike.bare "$out/A/fda-probe"
            cp "$RUNNER_TEMP/fda-probe" "$out/C/latch"
            sign co.plow.latch.fdaspike.outside "$out/C/latch"
            app="$out/B/Plow Latch CLI.app"
            cp "$RUNNER_TEMP/fda-probe" "$app/Contents/MacOS/latch"
            cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>co.plow.latch.fdaspike.app</string>
            <key>CFBundleName</key><string>Plow Latch CLI</string>
            <key>CFBundleExecutable</key><string>latch</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.0.1</string>
            <key>CFBundleVersion</key><string>$build</string>
            <key>LSBackgroundOnly</key><true/>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
          </dict>
          </plist>
          PLIST
            sign co.plow.latch.fdaspike.app "$app"
            for item in "$out/A/fda-probe" "$out/C/latch" "$app"; do
              codesign --verify --strict --verbose=2 "$item"
              codesign -dv --requirements - "$item" 2>&1 | grep -E 'Identifier|TeamIdentifier|CDHash|designated'
            done
          done
          tar -czf fda-spike.tar.gz spike
      - uses: actions/upload-artifact@v4
        with:
          name: fda-spike
          path: fda-spike.tar.gz
          if-no-files-found: error
      - name: Remove signing keychain
        if: always()
        shell: bash
        run: if [[ -n "${KEYCHAIN_PATH:-}" ]]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
