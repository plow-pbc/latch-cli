name: mac-tests

# The full macOS suite, by hand on any branch: `gh workflow run mac-tests
# --ref BRANCH` tests that branch's head, and its checks show on that commit.
# The release runs it beside its build, and publishes only if it passes.
# Two shards: each pays about a minute and a half of setup (checkout, caches,
# toolchain, browsers, build and test compile) for about eight minutes of
# tests, so two keep the suite near ten minutes without paying setup twice
# more.
run-name: Mac tests (${{ inputs.ref || github.ref_name }})
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to test (default: the ref this runs on)"
        type: string
        default: ''
  workflow_call:
  push:
    branches: [ci-mac-manual]

permissions:
  contents: read

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include: [{shard: 1, count: 1}, {shard: 1, count: 2}, {shard: 2, count: 2}]
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: latch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: rustup toolchain install
      - if: matrix.shard == 1
        run: python3 scripts/test-test-shard.py
      # Main's Mac job keeps this cache warm.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: latch -> target
          shared-key: mac-macos-15
          save-if: false
      - if: matrix.shard == 1
        run: cargo fmt --check && cargo clippy --all-targets --locked --features fake-gog -- -D warnings
      - uses: actions/cache@v4
        with:
          path: .dev/cft-state/plugins/cft
          key: cft-${{ runner.arch }}-${{ hashFiles('latch/src/browser/cft.json') }}
      - uses: actions/cache@v4
        with:
          path: .dev/cft-state/plugins/camoufox
          key: camoufox-${{ runner.arch }}-${{ hashFiles('latch/src/browser/camoufox.json', 'latch/camoufox/package.json', 'latch/camoufox/package-lock.json') }}
      - run: cargo build --locked
      - run: HOME="$RUNNER_TEMP/cft-home" sh install-binary.sh --state-dir ../.dev/cft-state --browser chrome --browser camoufox target/debug/latch
      # fake-gog: the test-only gog stand-in the return scenario reads mail with.
      - run: python3 scripts/test-shard.py ${{ matrix.shard }} ${{ matrix.count }} --features fake-gog
      - if: matrix.shard == 1
        run: LATCH_FUZZ_ITERATIONS=50000 swift test
        working-directory: latch/messages-reader
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-tests-${{ matrix.shard }}-of-${{ matrix.count }}
          path: .dev/ci/*.json
          if-no-files-found: error
