name: mac-tests

# The macOS gate (`just test`): clippy for the macOS-only code Linux never
# compiles, the Messages reader's tests, the app bundle, and the tests only
# macOS can answer. By hand on any branch: `gh workflow run mac-tests --ref
# BRANCH` tests that branch's head, and its checks show on that commit. A
# merge to main runs it as one job; the release runs it beside its build and
# makes its draft only if it passes. Two shards took 5.5 and 6.9 minutes on
# test-runner's first run.
run-name: Mac tests (${{ inputs.ref || github.ref_name }})
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to test (default: the ref this runs on)"
        type: string
        default: ''
      shards:
        description: Jobs to split the suite across, 1 or 2
        type: number
        default: 2
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      shards:
        type: number
        default: 2

permissions:
  contents: read

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards == 1 && '[1]' || '[1, 2]') }}
    # macOS 26's Xcode builds the app's window (the macOS 26 SDK).
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: latch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: rustup toolchain install
      # Main's runs keep this cache warm for every branch.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: latch -> target
          shared-key: mac-macos-26
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}
      - uses: actions/cache@v4
        with:
          path: .dev/cft-state/plugins/cft
          key: cft-${{ runner.arch }}-${{ hashFiles('latch/src/browser/cft.json') }}
      - uses: actions/cache@v4
        with:
          path: .dev/cft-state/plugins/camoufox
          key: camoufox-${{ runner.arch }}-${{ hashFiles('latch/src/browser/camoufox.json', 'latch/camoufox/package.json', 'latch/camoufox/package-lock.json') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest@0.9.148
      # The macOS gate, as on a laptop; shard 1 also lints and runs the
      # Swift, Python and app-bundle checks.
      - run: just test --shard ${{ matrix.shard }}/${{ inputs.shards == 1 && 1 || 2 }} --ci
      # The live tests and the scaling measurements run only by hand; they
      # still have to compile.
      - if: matrix.shard == 1
        working-directory: latch/gui
        run: LATCH_LIVE_TESTS=1 LATCH_SCALING=1 swift build --build-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-tests-${{ matrix.shard }}
          path: .dev/ci/*.json
          if-no-files-found: error
