<!doctype html><title>latch passkey sign-in test</title>
<!-- A sign-in that asks for a passkey only: a field marked webauthn, and
     no password or username field. -->
<h1>Sign in</h1>
<form>
  <p><label>Passkey <input type="text" name="passkey" autocomplete="webauthn"></label></p>
  <p><button type="button">Sign in with a passkey</button> <button type="button">Continue with Google</button></p>
</form>
