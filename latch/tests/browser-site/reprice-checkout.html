<!doctype html><meta charset="utf-8"><title>latch repricing checkout test</title>
<!-- A checkout whose total jumps from $10.00 to $100.00 once a card number
     is typed in: a confirmed card fill must not press Pay after that. -->
<h1>Checkout</h1>
<form method="post" action="pay">
  <p>Total <span id="total">$10.00</span></p>
  <p><label>Name on card <input name="cc-name"></label></p>
  <p><label>Card number <input name="cc-number" oninput="document.getElementById('total').textContent = '$100.00'"></label></p>
  <p><label>Expiry <input name="cc-exp" placeholder="MM / YY"></label></p>
  <p><label>CVV <input name="cc-csc" maxlength="4"></label></p>
  <p><button type="submit">Pay</button></p>
</form>
