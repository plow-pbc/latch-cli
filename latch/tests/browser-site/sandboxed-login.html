<!doctype html><title>latch sandboxed login test</title>
<!-- A login form inside a sandboxed frame: its origin is opaque. -->
<iframe width="420" height="200" sandbox="allow-forms allow-scripts" srcdoc="<form method=post action=welcome><label>Email <input type=email name=email></label> <label>Password <input type=password name=password></label> <button type=submit>Sign in</button></form>"></iframe>
