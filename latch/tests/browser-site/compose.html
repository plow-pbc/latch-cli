<!doctype html><meta charset="utf-8"><title>latch compose test</title>
<!-- A message composer: a box and its Send, which can't be undone, and a
     Mark read beside them, which can. -->
<h1>Messages</h1>
<p id="out">nothing sent</p>
<form id="compose">
  <p><label>Message <textarea id="body"></textarea></label></p>
  <p><button type="submit" id="send">Send</button></p>
</form>
<p><button type="button" id="read">Mark read</button></p>
<script>
  const out = document.getElementById('out');
  document.getElementById('compose').addEventListener('submit', (e) => {
    e.preventDefault();
    out.textContent = 'sent: ' + document.getElementById('body').value;
  });
  document.getElementById('read').addEventListener('click', (e) => {
    out.textContent = 'marked read, trusted ' + e.isTrusted;
  });
</script>
