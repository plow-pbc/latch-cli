<!doctype html><meta charset="utf-8"><title>Drawn over · Shop</title>
<!-- Controls a click aimed at lands on their container instead, which
     never passes it on: a button whose container draws an ::after over
     it, a button that takes no pointer events, and a checkbox that takes
     none under its container's ::after. Last, a selection card whose
     ::after is only drawn (it takes no pointer events): a click on its
     checkbox is the click on the card. -->
<style>
  .wrap { position: relative; display: inline-block; padding: 8px; }
  .over::after { content: ''; position: absolute; inset: 0; background: #ddd; }
  .shade::after { content: ''; position: absolute; inset: 0; background: #0001; pointer-events: none; }
  .card { position: relative; display: flex; gap: 8px; padding: 12px; border: 1px solid #ccc; width: 240px; }
  .card input { height: 0; opacity: 0; position: absolute; width: 0; }
</style>
<div class="wrap over" id="over"><button id="save">Save</button></div>
<div class="wrap" id="plain"><button id="send" style="pointer-events: none">Send</button></div>
<div class="wrap over" id="boxed"><span style="pointer-events: none"><input type="checkbox" id="gift" aria-label="Gift wrap"></span></div>
<div class="card shade" id="card"><span>Gift box</span><span style="pointer-events: none"><input type="checkbox" id="box"></span></div>
<p id="out">nothing clicked</p>
<script>
  const out = document.getElementById('out');
  for (const id of ['save', 'send', 'gift']) {
    document.getElementById(id).addEventListener('click', (e) => { e.stopPropagation(); out.textContent = `clicked ${id}`; });
  }
  for (const id of ['over', 'plain', 'boxed']) {
    document.getElementById(id).addEventListener('click', () => { out.textContent = `clicked ${id}`; });
  }
  document.getElementById('card').addEventListener('click', () => {
    const box = document.getElementById('box');
    box.checked = !box.checked;
    out.textContent = `card ${box.checked ? 'picked' : 'not picked'}`;
  });
</script>
