<!doctype html><meta charset="utf-8"><title>Drawn over · Shop</title>
<!-- A button whose own container draws an ::after over it, which takes
     the click: a click aimed at the button lands on the container. -->
<style>
  .wrap { position: relative; display: inline-block; padding: 8px; }
  .wrap::after { content: ''; position: absolute; inset: 0; background: #0001; }
</style>
<div class="wrap" id="wrap"><button id="save">Save</button></div>
<p id="out">nothing clicked</p>
<script>
  const out = document.getElementById('out');
  document.getElementById('save').addEventListener('click', (e) => { e.stopPropagation(); out.textContent = 'clicked the button'; });
  document.getElementById('wrap').addEventListener('click', () => { out.textContent = 'clicked the overlay'; });
</script>
