<!doctype html><title>latch two sign-in forms test</title>
<!-- Two legitimate forms with the same tokens: a personal and a business
     sign-in, each with its own submit button. -->
<h1>Sign in</h1>
<form method="post" action="welcome">
  <h2>Personal</h2>
  <p><label>Email <input type="email" name="email" autocomplete="username"></label></p>
  <p><label>Password <input type="password" name="password" autocomplete="current-password"></label></p>
  <p><button type="submit">Sign in</button></p>
</form>
<form method="post" action="welcome">
  <h2>Business</h2>
  <p><label>Work email <input type="email" name="email" autocomplete="username"></label></p>
  <p><label>Work password <input type="password" name="password" autocomplete="current-password"></label></p>
  <p><button type="submit">Sign in to business</button></p>
</form>
