<!doctype html><title>latch formless boxed code test</title>
<!-- A code in six one-character boxes in no form, each in a wrapper of
     its own, each moving the focus on to the next once it holds its digit.
     With ?stray, box 3 moves the focus instead to a promo field after the
     boxes, outside their group, which says so if anything is typed into it. Verify posts
     the joined code as `otp` to /verify. -->
<h1>Two-step verification</h1>
<div role="group" aria-label="Authentication code">
  <div><input aria-label="Digit 1" autocomplete="one-time-code" inputmode="numeric" maxlength="1"></div>
  <div><input aria-label="Digit 2" inputmode="numeric" maxlength="1"></div>
  <div><input aria-label="Digit 3" inputmode="numeric" maxlength="1"></div>
  <div><input aria-label="Digit 4" inputmode="numeric" maxlength="1"></div>
  <div><input aria-label="Digit 5" inputmode="numeric" maxlength="1"></div>
  <div><input aria-label="Digit 6" inputmode="numeric" maxlength="1"></div>
</div>
<footer><label>Promo code <input id="promo" maxlength="10"></label> <span id="touched"></span></footer>
<form method="post" action="verify">
  <input type="hidden" name="otp">
  <p><button type="submit">Verify</button></p>
</form>
<script>
  const boxes = [...document.querySelectorAll('[aria-label^=Digit]')];
  const promo = document.getElementById('promo');
  const stray = location.search.includes('stray');
  boxes.forEach((box, at) => {
    box.addEventListener('input', () => {
      box.value = box.value.replace(/\D/g, '').slice(-1);
      if (!box.value) return;
      if (stray && at === 2) promo.focus();
      else if (boxes[at + 1]) boxes[at + 1].focus();
    });
  });
  promo.addEventListener('input', () => { document.getElementById('touched').textContent = 'promo touched'; });
  document.querySelector('form').addEventListener('submit', () => {
    document.querySelector('[name=otp]').value = boxes.map(b => b.value).join('');
  });
</script>
