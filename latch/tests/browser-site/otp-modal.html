<!doctype html><title>latch code test: stacked dialogs</title>
<!-- A sign-in dialog with a code dialog stacked over it, each rendered at
     the end of the body as modal libraries do; the code is a number field.
     Each dialog keeps the focus inside itself while it is the top one. With
     ?trap the sign-in dialog keeps holding it once the code dialog is over
     it, taking it back to itself (a focus trap that missed the second
     dialog), so a click on the code field leaves the focus on the dialog.
     `selected` is how much of the page is selected. -->
<style>
  .back { position: fixed; inset: 0; background: #0006; display: grid; place-items: center; }
  .box { background: white; padding: 24px; width: 420px; }
</style>
<nav><a href="#">Home</a> · <a href="#">Grocery</a> · <a href="#">Retail</a></nav>
<p id="out">not verified</p>
<p id="selected">selected: 0</p>
<script>
  const dialog = (label, html) => {
    const back = document.createElement('div');
    back.className = 'back';
    back.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="${label}" tabindex="-1">${html}</div>`;
    document.body.append(back);
    return back.firstChild;
  };
  const signIn = dialog('Sign in', `<h2>Sign in or Sign up</h2>
    <p><label>Password <input type="password" value="hunter22"></label></p><p><button>Sign in</button></p>`);
  const verify = dialog('2-Step Verification', `<h2>2-Step Verification</h2>
    <p>We sent a code to your phone.</p>
    <p><label>Enter your 6-digit code <input id="code" type="number"></label></p>
    <p><button>Cancel</button> <button id="go" disabled>Submit</button></p>`);
  const stack = [signIn, verify];
  const holder = location.search === '?trap' ? signIn : stack[stack.length - 1];
  document.addEventListener('focusin', (e) => {
    if (!holder.contains(e.target)) holder.focus();
  });
  const [code, go] = [document.getElementById('code'), document.getElementById('go')];
  code.addEventListener('input', () => { go.disabled = !/^\d{6}$/.test(code.value); });
  go.addEventListener('click', () => { document.getElementById('out').textContent = `verified ${code.value}`; });
  document.addEventListener('selectionchange', () => {
    document.getElementById('selected').textContent = `selected: ${document.getSelection().toString().length}`;
  });
</script>
