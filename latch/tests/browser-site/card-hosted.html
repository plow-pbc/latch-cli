<!doctype html><title>latch hosted checkout test</title>
<!-- A checkout shaped like a payment provider's hosted page: the card's
     fields in the page's own frame, the number and expiry formatted as
     they are typed (card-format.js). Pay sends the number's digits, the
     expiry as shown, to /pay. With ?unblank the page takes back any
     style put on the number field. ?slow posts to a /pay that answers
     late; ?late sends the form a while after the press. Every input or
     change event is counted in localStorage, and the count as the page
     leaves is kept beside it. -->
<script src="card-format.js"></script>
<h1>Pay $10.00</h1>
<form method="post" action="pay" id="pay">
  <p><label>Card number <input id="number" autocomplete="cc-number" inputmode="numeric" placeholder="1234 1234 1234 1234"></label></p>
  <p><label>Expiry <input id="expiry" autocomplete="cc-exp" placeholder="MM / YY"></label></p>
  <p><label>CVC <input id="cvc" autocomplete="cc-csc" maxlength="4"></label></p>
  <p><label>Name on card <input id="name" autocomplete="cc-name"></label></p>
  <input type="hidden" name="cc-number"><input type="hidden" name="cc-exp">
  <input type="hidden" name="cc-csc"><input type="hidden" name="cc-name">
  <p><button type="submit">Pay $10.00</button></p>
</form>
<script>
  formatAs(number, cardFormat.number);
  if (new URLSearchParams(location.search).has('unblank')) {
    new MutationObserver(() => {
      if (number.getAttribute('style')) number.removeAttribute('style');
    }).observe(number, { attributes: true, attributeFilter: ['style'] });
  }
  formatAs(expiry, cardFormat.expiry);
  const search = new URLSearchParams(location.search);
  const form = document.getElementById('pay');
  if (search.has('slow')) form.action = 'pay?slow';
  localStorage.changes = 0;
  for (const kind of ['input', 'change']) {
    document.addEventListener(kind, () => { localStorage.changes = Number(localStorage.changes) + 1; }, true);
  }
  addEventListener('pagehide', () => { localStorage.atLeaving = localStorage.changes; });
  document.getElementById('pay').addEventListener('submit', (event) => {
    if (search.has('late') && !form.dataset.waited) {
      event.preventDefault();
      form.dataset.waited = 'yes';
      setTimeout(() => form.requestSubmit(), 2000);
      return;
    }
    form.elements['cc-number'].value = number.value.replace(/\D/g, '');
    form.elements['cc-exp'].value = expiry.value;
    form.elements['cc-csc'].value = cvc.value;
    form.elements['cc-name'].value = document.getElementById('name').value;
  });
</script>
