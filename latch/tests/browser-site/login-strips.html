<!doctype html><title>latch login strips test</title>
<!-- A sign-in whose fields drop characters as they are typed: with
     ?strip=email the email loses its dots, with ?strip=password the
     password its dashes. A fill must not take either as the saved login. -->
<h1>Sign in</h1>
<form method="post" action="welcome">
  <p><label>Email <input type="text" name="email" autocomplete="username"></label></p>
  <p><label>Password <input type="password" name="password" autocomplete="current-password"></label></p>
  <p><button type="submit">Sign in</button></p>
</form>
<script>
  const strip = new URLSearchParams(location.search).get('strip');
  const field = document.querySelector(`[name=${strip}]`);
  const drop = strip === 'email' ? /\./g : /-/g;
  if (field) field.addEventListener('input', () => { field.value = field.value.replace(drop, ''); });
</script>
