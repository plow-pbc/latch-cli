<!doctype html><title>latch revealed password test</title>
<!-- A sign-in whose password is shown as text ("Show password" on), still
     marked current-password; posts to /welcome. -->
<h1>Sign in</h1>
<form method="post" action="welcome">
  <p><label>Email <input type="email" name="email" autocomplete="username"></label></p>
  <p><label>Password <input type="text" name="password" autocomplete="current-password"></label></p>
  <p><button type="submit">Sign in</button></p>
</form>
