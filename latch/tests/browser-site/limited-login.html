<!doctype html><title>latch rate-limited login test</title>
<!-- A login that sends its form with fetch to /limited, which the test
     server answers 429 with Retry-After: 30, and stays on the page. With
     ?two its email and password are two stages in one document, the
     password stage's send refused so; with ?alert the send first shows
     the password in an alert, as a hostile page could; with ?late the form
     empties at once and the refusal comes 700 ms later; with ?first the
     email stage's own send is refused, and no password stage comes. -->
<h1>Sign in</h1>
<form id="first">
  <p><label>Email <input type="email" name="email" autocomplete="username"></label></p>
  <p class="one"><label>Password <input type="password" name="password" autocomplete="current-password"></label></p>
  <p><button type="submit">Sign in</button></p>
</form>
<form id="second" hidden>
  <p><label>Password <input type="password" name="password" autocomplete="current-password"></label></p>
  <p><button type="submit">Sign in</button></p>
</form>
<p id="out"></p>
<script>
  const two = location.search === '?two' || location.search === '?first';
  const [first, second] = [document.getElementById('first'), document.getElementById('second')];
  if (two) first.querySelector('.one').remove();
  const send = async (form) => {
    if (location.search === '?alert') alert(form.password.value);
    const body = new FormData(form);
    if (location.search === '?late') form.reset();
    const sent = await fetch(location.search === '?late' ? 'limited-late' : 'limited', { method: 'POST', body });
    form.reset();
    document.getElementById('out').textContent = sent.ok ? 'signed in' : 'Something went wrong';
  };
  first.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!two) return send(first);
    if (location.search === '?first') return send(first);
    first.hidden = true;
    first.reset();
    setTimeout(() => { second.hidden = false; }, 300);
  });
  second.addEventListener('submit', (e) => { e.preventDefault(); send(second); });
</script>
