<!doctype html><meta charset="utf-8"><title>latch shadow test</title>
<!-- Parts of a page drawn inside shadow roots, as some sites draw a
     message pop-up: an open root, read like the page around it, holding a
     frame from another site (served at ?cross=PORT), which stays a frame
     of its own, and text it hides; an open root in a hidden element; and
     a closed root, which no reader reaches. The page's own search box is
     beside them; ?closed draws only the closed root. -->
<h1>Messages</h1>
<p><label>Search <input type="search" id="search"></label></p>
<p id="out">nothing sent</p>
<div id="overlay"></div>
<div id="closed"></div>
<div id="hidden-host" hidden></div>
<div id="chip" role="button" tabindex="0" aria-label="Mark read" style="display:inline-block"></div>
<script>
  const params = new URLSearchParams(location.search);
  if (!params.has('closed')) {
    const open = document.getElementById('overlay').attachShadow({ mode: 'open' });
    open.innerHTML = `<section role="dialog" aria-labelledby="who">
      <h2 id="who">Conversation with Ada Lovelace</h2>
      <div role="textbox" contenteditable="true" aria-label="Write a message" style="border:1px solid #888;min-height:2em"></div>
      <form>
        <p><label>First name <input id="first" autocomplete="given-name"></label></p>
        <p><label>City <input id="city" autocomplete="address-level2"></label></p>
      </form>
      <button id="send">Send</button>
      <iframe id="cross" width="300" height="80"></iframe>
    </section>
    <p hidden>hidden-shadow-text</p>
    <div style="display:contents">Seen 2h ago</div>
    <div style="display:contents;visibility:hidden">hidden-boxless-text</div>
    <slot>No older messages</slot>`;
    const box = open.querySelector('[role=textbox]');
    open.getElementById('send').addEventListener('click', (e) => {
      document.getElementById('out').textContent = 'sent: ' + box.textContent + ', trusted ' + e.isTrusted;
    });
    if (params.get('cross')) open.getElementById('cross').src = 'http://localhost:' + params.get('cross') + '/cross.html';
  }
  document.getElementById('hidden-host').attachShadow({ mode: 'open' }).innerHTML =
    '<div style="display:contents">hidden-host-text</div>';
  // A control drawn wholly by its own shadow root: a click lands on what
  // the root draws, inside the control.
  const chip = document.getElementById('chip');
  chip.attachShadow({ mode: 'open' }).innerHTML = '<span style="display:inline-block;padding:8px;border:1px solid #888">Mark read</span>';
  chip.addEventListener('click', (e) => { document.getElementById('out').textContent = 'marked read, trusted ' + e.isTrusted; });
  const closed = document.getElementById('closed').attachShadow({ mode: 'closed' });
  closed.innerHTML = '<p>closed-root-text</p><label>Closed field <input></label>';
</script>
