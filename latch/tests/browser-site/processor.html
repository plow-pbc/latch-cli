<!doctype html><title>latch payment frame test</title>
<!-- A shop's checkout whose card fields sit in a payment processor's frame
     on another site: open with ?frame=PORT, and the frame comes from
     http://localhost:PORT/processor-frame.html. -->
<h1>Checkout</h1>
<p>Total $10.00</p>
<iframe id="pay" width="460" height="260"></iframe>
<script>
  const frame = new URLSearchParams(location.search).get('frame');
  if (frame) document.getElementById('pay').src = 'http://localhost:' + frame + '/processor-frame.html';
</script>
