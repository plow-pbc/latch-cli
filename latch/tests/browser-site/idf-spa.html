<!doctype html><title>latch same-document identifier-first test</title>
<!-- Both stages of a sign-in in one document: the email form's "Continue"
     hides it and, after 300 ms, shows the password form, which posts to
     /welcome. -->
<h1>Sign in</h1>
<form id="first">
  <p><label>Email <input type="email" name="email" autocomplete="username"></label></p>
  <p><button type="submit">Continue</button></p>
</form>
<form id="second" method="post" action="welcome" hidden>
  <p><label>Password <input type="password" name="password" autocomplete="current-password"></label></p>
  <p><button type="submit">Sign in</button></p>
</form>
<script>
  document.getElementById('first').addEventListener('submit', (event) => {
    event.preventDefault();
    event.target.hidden = true;
    setTimeout(() => { document.getElementById('second').hidden = false; }, 300);
  });
</script>
