<!doctype html><title>latch card echo test</title>
<!-- A checkout that shows the card back: a preview of the number as it is
     typed, and, on Pay, a confirmation on the same page with the whole
     number, as a careless shop might. Nothing is sent anywhere. -->
<h1>Checkout</h1>
<p>Total $10.00</p>
<p id="preview">•••• •••• •••• ••••</p>
<form id="pay">
  <p><label>Card number <input name="cc-number" autocomplete="cc-number" inputmode="numeric"></label></p>
  <p><label>Expiry <input name="cc-exp" autocomplete="cc-exp" placeholder="MM / YY"></label></p>
  <p><label>CVC <input name="cc-csc" autocomplete="cc-csc" maxlength="4"></label></p>
  <p><button type="submit">Pay $10.00</button></p>
</form>
<p id="done"></p>
<script>
  const form = document.getElementById('pay');
  const number = form.elements['cc-number'];
  const spaced = () => number.value.replace(/\D/g, '').replace(/(\d{4})(?=\d)/g, '$1 ');
  number.addEventListener('input', () => { preview.textContent = spaced(); });
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    done.textContent = 'Paid $10.00 with card ' + spaced();
    form.reset();
  });
</script>
