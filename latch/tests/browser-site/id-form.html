<!doctype html><title>latch identity form test</title>
<!-- A form that asks for an identity's secret: a Social Security number,
     sent with the applicant's name to /apply. The number shows its text
     large and red, the name large and blue. -->
<style>
  input { font: bold 24px sans-serif; color: rgb(0, 0, 255) }
  #ssn {
    color: rgb(255, 0, 0); -webkit-text-stroke: 1px rgb(255, 0, 0);
    text-shadow: 2px 2px rgb(255, 0, 0);
  }
</style>
<h1>Application</h1>
<form method="post" action="apply">
  <p><label>First name <input name="given-name" autocomplete="given-name"></label></p>
  <p><label>Social Security number <input id="ssn" name="ssn"></label></p>
  <p><button type="submit">Submit application</button></p>
</form>
