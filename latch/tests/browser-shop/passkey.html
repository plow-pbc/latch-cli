<!doctype html><html><head><meta charset="utf-8"><title>Sign in with a passkey — Greenleaf Market</title><link rel="stylesheet" href="style.css"><script src="shop.js"></script></head>
<body><main></main><script>
header(); cookieBanner();
const main = document.querySelector('main');

// A passkey-first sign-in: a field for the passkey prompt, its button, and
// a way to the password path instead.
const next = qs("next") || "account.html";
main.innerHTML = `<h1>Sign in</h1><form id="f" onsubmit="return false">
<label>Passkey <input id="passkey" autocomplete="webauthn"></label>
<p><button type="button">Sign in with a passkey</button></p></form>
<p><a href="login.html?next=${encodeURIComponent(next)}">Use your password instead</a></p>`;
</script></body></html>
