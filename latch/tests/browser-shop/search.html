<!doctype html><html><head><meta charset="utf-8"><title>Search results — Greenleaf Market</title><link rel="stylesheet" href="style.css"><script src="shop.js"></script></head>
<body><main></main><script>
header(); cookieBanner();
const main = document.querySelector('main');

const q = (qs("q") || "").trim().toLowerCase();
if (!q) { main.innerHTML = "<h1>Search</h1><p>Enter a search term above.</p>"; }
else {
  const found = CATALOG.filter((p) => p.name.toLowerCase().includes(q) || p.cat.includes(q));
  main.innerHTML = `<h1>Results for “${qs("q")}”</h1><p>${found.length} products found</p><ul class="products">${found.map(productRow).join("")}</ul>`;
}
</script></body></html>
