<!doctype html><html><head><meta charset="utf-8"><title>Enter your password — Greenleaf Market</title><link rel="stylesheet" href="style.css"><script src="shop.js"></script></head>
<body><main></main><script>
header(); cookieBanner();
const main = document.querySelector('main');

const email = qs("email") || "";
if (!email) location.replace("login.html");
main.innerHTML = `<h1>Enter your password</h1><p>Signing in as ${email.replace(/(.).*@/, "$1•••@")}</p>
<form id="f" onsubmit="return false"><label>Password <input type="password" id="pw" autocomplete="current-password"></label>
<p><button type="submit" id="go">Sign in</button></p></form><p><a href="#">Forgot password?</a></p>`;
document.getElementById("go").onclick = () => {
  const pw = document.getElementById("pw").value;
  if (pw.length < 6) { main.querySelector("h1").insertAdjacentHTML("afterend", "<p class=err>That password is too short.</p>"); return; }
  store.set("user", {email}); location.href = qs("next") || "account.html";
};
</script></body></html>
