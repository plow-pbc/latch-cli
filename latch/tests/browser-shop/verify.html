<!doctype html><html><head><meta charset="utf-8"><title>Verify it's you — Greenleaf Market</title><link rel="stylesheet" href="style.css"><script src="shop.js"></script></head>
<body><main></main><script>
header(); cookieBanner();
const main = document.querySelector('main');

// A code stage: a one-time code, which could have come by text or from an
// authenticator. Six digits mark the account verified and go on to ?next.
main.innerHTML = `<h1>Verify it's you</h1><p>Enter the 6-digit code.</p>
<form id="f" onsubmit="return false"><label>Verification code <input id="code" autocomplete="one-time-code" inputmode="numeric" maxlength="6"></label>
<p><button type="submit" id="go">Verify</button></p></form>`;
document.getElementById("go").onclick = () => {
  if (!/^\d{6}$/.test(document.getElementById("code").value)) return;
  store.set("verified", true); location.href = qs("next") || "account.html";
};
</script></body></html>
