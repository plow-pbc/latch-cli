<!doctype html><html><head><meta charset="utf-8"><title>Review your return — Greenleaf Market</title><link rel="stylesheet" href="style.css"><script src="shop.js"></script></head>
<body><main></main><script>
header();
const main = document.querySelector('main');
const picked = store.get('return', []);
main.innerHTML = `<h1>Review your return</h1>
${picked.length ? `<ul>${picked.map((p) => `<li>${p.name} — ${p.reason}</li>`).join('')}</ul>
<p>A prepaid label will be emailed to you. Your refund is issued when the items arrive.</p>
<form method="post" action="returns"><input type="hidden" name="order" value="A1001">
<input type="hidden" name="items" value='${JSON.stringify(picked)}'>
<button type="submit">Submit return</button></form>
<p><a href="return.html?order=A1001">Back to choose items</a></p>` : `<p>Your return is empty. <a href="return.html?order=A1001">Choose items</a></p>`}`;
</script></body></html>
