<!doctype html><html><head><meta charset="utf-8"><title>Note for the driver — Greenleaf Market</title><link rel="stylesheet" href="style.css"><script src="shop.js"></script></head>
<body><main></main><script>
header(); cookieBanner();
const main = document.querySelector('main');

// One field, a note, and nothing else to type into.
main.innerHTML = `<h1>Note for the driver</h1><form onsubmit="return false">
<label>Note for the driver <textarea id="note" rows="2"></textarea></label>
<p><button type="button" id="save">Save note</button></p></form>`;
document.getElementById("save").onclick = () => { store.set("note", document.getElementById("note").value); flash({ok: "Note saved."}); };
</script></body></html>
