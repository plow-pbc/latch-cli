<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<!-- The host's form runs in a srcdoc frame, which inherits this policy, so
     inline script and style are allowed; nothing but this page's own files
     and the host's form ever load. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self' https: wss:; style-src 'self' 'unsafe-inline'; frame-src 'self'; base-uri 'none'; form-action 'none'">
<title>latch</title>
<link rel="stylesheet" href="shim.css">
</head>
<body>
<header id="status">Connecting…</header>
<iframe id="page" title="latch" sandbox="allow-scripts allow-forms" hidden></iframe>
<script type="module" src="shim.js"></script>
</body>
</html>
