# The phone page's shim: iroh built for the browser, so a phone can dial a
# latch host through its relay. Its own workspace: it builds for
# wasm32-unknown-unknown with iroh's `ring` backend, and stays out of
# latch's build and gates. `build.sh` builds it into `dist/`.
[workspace]

[package]
name = "latch-phone"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The same iroh as latch, without its defaults; the browser build needs
# `ring` (aws-lc-rs does not build for wasm).
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
# The JavaScript bindings; the `wasm-bindgen` CLI must be this exact version.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# Panics as readable messages in the browser console.
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
