# The latch workspace. Today it holds one crate (this one); the `[workspace]`
# table makes this directory the workspace root so later crates can join it.
# DEPENDENCIES.md has each crate's usage numbers from the library audit.
[workspace]

[package]
name = "latch"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
# Command-line parsing: each command is a plain struct (src/cli.rs). `env`
# lets `--host` fall back to `$LATCH_HOST`.
clap = { version = "4.6.7", features = ["derive", "env"] }
# Peer-to-peer QUIC; a peer's identity is its iroh key. Not the default
# features: those pull in `ring`, a second crypto library next to reqwest's
# aws-lc-rs, and metrics we don't use.
iroh = { version = "1.3.0", default-features = false, features = ["tls-aws-lc-rs", "portmapper", "fast-apple-datapath"] }
# The relay's status messages, which a host names in its log
# (src/relay_link.rs). iroh's own; no server.
iroh-relay = { version = "1.3.0", default-features = false }
# The error type a resolver of iroh's own fails with (src/system_dns.rs).
n0-error = "1.0.1"
# Time stamps (RFC 3339, UTC) in the audit log and the host's log.
jiff = { version = "0.2.38", features = ["serde"] }
# The C library: `killpg` to stop a timed-out program with everything it
# started, and signal numbers to name how a program ended.
libc = "0.2.190"
# Random jitter for the heartbeat and its backoff, so hosts never synchronise.
rand = "0.10.3"
# HTTP client for Plow's directory, over rustls (no OpenSSL) so Linux builds stay static.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
# Turns our plain structs into JSON and back (Plow's API, our output, config.json).
serde = { version = "1.0.229", features = ["derive"] }
# `raw_value`: a decision request's state is sent as written, its keys in
# their own order (a `Value` sorts them).
serde_json = { version = "1.0.154", features = ["raw_value"] }
# sha256 for the audit log's hash chain.
sha2 = "0.11.1"
# iroh and reqwest are async, so latch runs on tokio. `io-util` reads and
# writes the wire frames; `signal` lets `serve` stop cleanly on SIGINT/SIGTERM;
# `process` runs the sandboxed file workers; `fs` writes the client's files.
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
# `LATCH_TRACE` (src/trace.rs): iroh's own events, filtered, to the
# host's log, inside a span per connection and operation. No colours.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }

# Per-call folders for Google and throwaway test state.
tempfile = "3.27.0"

# The vault (src/vault): items sealed with AES-256-GCM; URLs read and
# matched by registrable domain (the public-suffix list, private suffixes
# included); TOTP codes; password-manager exports (CSV, and 1PUX zips).
aes-gcm = "0.11.1"
csv = "1.4.0"
psl = "2.1.239"
totp-rs = { version = "6.0.0", default-features = false, features = ["std"] }
url = "2.5.8"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
# `latch vault link`'s QR code, drawn in the terminal (no image backends).
qrcode = { version = "0.14.1", default-features = false }
# How many columns text takes in a terminal (CJK and emoji take two), so the
# overview cuts its rows to fit.
unicode-width = "0.2.2"
# `latch update`: a release's minisign signature, checked with the key latch
# carries (src/update.rs).
minisign-verify = "0.3.0"

# Windows' own APIs where std has none: a background host's process, the
# console's modes, waiting for changes, the machine's name and DPAPI for
# secrets. The version tokio already builds.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
# A local iroh relay (plain HTTP), so the test that runs a real host and
# client needs no internet. Tests only; never in a latch build.
iroh-relay = { version = "1.3.0", default-features = false, features = ["server"] }
# Signs the test releases `latch update` checks, with a key made per test.
minisign = "0.10.0"
# A paused clock, for tests that time latch's own waits apart from how
# busy the machine running them is.
tokio = { version = "1.53.3", features = ["test-util"] }

# The build date `latch --version` prints (build.rs).
[build-dependencies]
jiff = "0.2.38"

[features]
# Builds the tests that ask the decision model for real, through Plow on a
# logged-in state folder; `just gatekeeper` runs them. Never part of the gate.
live-model = []
# Runs the real-engine browser tests headed, with a window behind the
# owner's, for what only a real window shows (its focus); `just
# test-headed` runs them. Never part of the gate.
headed-tests = []
# Builds the real-engine browser tests on Linux; `just test` on Linux
# builds with it and installs the engine first.
linux-browser-tests = []
# Builds the managed-host tests on Linux, for a machine with a systemd user
# session; `just test` on Linux builds with it (the container has none).
systemd-tests = []
# A stand-in for gog (src/google/fake.rs), so a test can search a made-up
# mailbox: the host accepts this binary itself as gog. Tests only; it does
# not compile in release, and the release workflow checks its binaries.
fake-gog = []

[target.'cfg(target_os = "macos")'.dependencies]
# A Camoufox handoff brings its app forward through AppKit
# (`NSRunningApplication`); already in the tree through iroh.
objc2 = "0.6.5"
# A signed macOS latch keeps its secrets in the data-protection Keychain
# (src/secrets.rs); both crates are already in the tree through the TLS stack.
core-foundation = "0.10.1"
security-framework-sys = { version = "2.17.0", features = ["OSX_10_15"] }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "=0.5.0"
