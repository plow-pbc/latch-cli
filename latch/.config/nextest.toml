# nextest runs each test in a process of its own, so the browser tests'
# in-process limits (browser/tests.rs) need saying here too: at most six
# drive a real engine at once, and the two that keep a browser busy run
# alone.

[test-groups]
engines = { max-threads = 6 }

[[profile.default.overrides]]
filter = 'test(/::frames_that_come_and_go_while_a_page_loads_break_no_call$/) | test(/::a_login_goes_on_to_its_password_stage_in_one_pause$/)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'test(/^browser::tests::/)'
test-group = 'engines'

# Longest first, so no part of a CI run ends on one of them started late:
# these three took 70 to 104 seconds each on CI's Linux runners, then the
# other engine tests, with the fast ones filling in at the end.
[[profile.default.overrides]]
filter = 'test(/::no_secret_goes_into_a_form_sent_by_get$/) | test(/::each_checker_tells_its_right_state_from_the_near_misses$/) | test(/::instruction_steps_offer_only_what_is_possible_and_stop_in_order$/)'
priority = 100

[[profile.default.overrides]]
filter = 'test(/^browser::tests::/)'
priority = 50
